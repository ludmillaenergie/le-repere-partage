<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Repère</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Raleway:wght@400;500;600&display=swap');

  :root {
    --bg: #09070a;
    --bg-soft: #14101a;
    --gold: #c8a96e;
    --gold-dim: #8d7350;
    --ivory: #ece4d6;
    --ivory-dim: #b8ac99;
    --teal: #5ba394;
    --wine: #a25a5e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ivory); font-family: 'Raleway', sans-serif; min-height: 100vh; }

  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 24px; }
  .gate-box { width: 100%; max-width: 380px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.3em; color: var(--gold); text-transform: uppercase; margin-bottom: 18px; text-align: center; }
  h1.gate-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 38px; margin: 0 0 32px; text-align: center; }

  .tabs { display: flex; border-bottom: 1px solid rgba(200,169,110,0.2); margin-bottom: 28px; }
  .tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ivory-dim); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; position: relative; }
  .field label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ivory-dim); }
  .field input {
    background: var(--bg-soft); border: 1px solid rgba(200,169,110,0.25); color: var(--ivory);
    font-family: 'Raleway', sans-serif; font-size: 14px; padding: 12px 14px; border-radius: 2px; outline: none;
  }
  .field input:focus { border-color: var(--gold); }
  .field .hint { font-size: 11px; color: var(--gold-dim); font-style: italic; font-family: 'Cormorant Garamond', serif; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }

  #city-suggestions { display:none; position:absolute; top:100%; left:0; right:0; z-index:10; background:var(--bg-soft); border:1px solid rgba(200,169,110,0.3); max-height:200px; overflow-y:auto; margin-top:2px; }
  #city-suggestions div { padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid rgba(236,228,214,0.08); }

  button.primary {
    width: 100%; background: transparent; border: 1px solid var(--gold-dim); color: var(--gold);
    font-family: 'Raleway', sans-serif; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 13px 26px; cursor: pointer; margin-top: 8px;
  }
  button.primary:hover { border-color: var(--gold); background: rgba(200,169,110,0.08); }
  button.primary:disabled { opacity: 0.4; cursor: default; }

  .status { font-size: 13px; color: var(--ivory-dim); font-style: italic; margin-top: 14px; min-height: 18px; text-align: center; }
  .status.error { color: var(--wine); font-style: normal; }
  .status.ok { color: var(--teal); font-style: normal; }

  section#signup-fields, section#login-fields { display: none; }
  section#signup-fields.visible, section#login-fields.visible { display: block; }

  /* --- app (après connexion) --- */
  #app { display: none; max-width: 640px; margin: 0 auto; padding: 0 0 60px; }
  header.top { text-align: center; padding: 48px 24px 36px; }
  header.top .eyebrow { margin-bottom: 16px; }
  header.top h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 42px; margin: 0 0 8px; }
  section.block { padding: 28px 24px; border-top: 1px solid rgba(200,169,110,0.14); }
  section.block .label { font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  section.block .title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; margin: 0 0 20px; }
  #reading { font-family: 'Cormorant Garamond', serif; font-size: 19px; line-height: 1.75; }
  .loading { font-style: italic; color: var(--ivory-dim); font-size: 15px; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div class="eyebrow">Le Repère</div>
    <h1 class="gate-title">Bienvenue</h1>

    <div class="tabs">
      <div class="tab active" id="tab-login">J'ai déjà un compte</div>
      <div class="tab" id="tab-signup">Je m'inscris</div>
    </div>

    <section id="login-fields" class="visible">
      <div class="field">
        <label for="l-username">Identifiant</label>
        <input type="text" id="l-username" autocomplete="username">
      </div>
      <div class="field">
        <label for="l-password">Mot de passe</label>
        <input type="password" id="l-password" autocomplete="current-password">
      </div>
      <button class="primary" id="login-btn">Entrer</button>
    </section>

    <section id="signup-fields">
      <div class="field">
        <label for="s-name">Prénom</label>
        <input type="text" id="s-name">
      </div>
      <div class="field">
        <label for="s-username">Identifiant souhaité</label>
        <input type="text" id="s-username" autocomplete="username">
        <div class="hint">3-30 caractères, lettres/chiffres/tirets uniquement</div>
      </div>
      <div class="field">
        <label for="s-password">Mot de passe</label>
        <input type="password" id="s-password" autocomplete="new-password">
        <div class="hint">8 caractères minimum</div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="s-date">Date de naissance</label>
          <input type="date" id="s-date">
        </div>
        <div class="field">
          <label for="s-time">Heure de naissance</label>
          <input type="time" id="s-time">
        </div>
      </div>
      <div class="field">
        <label for="s-city">Lieu de naissance</label>
        <input type="text" id="s-city" placeholder="Commence à taper une ville…" autocomplete="off">
        <div id="city-suggestions"></div>
      </div>
      <button class="primary" id="signup-btn">Créer mon compte</button>
    </section>

    <div class="status" id="gate-status"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="eyebrow">Le Repère</div>
    <h1 id="app-greeting">–</h1>
  </header>
  <section class="block">
    <div class="label">Lecture du jour</div>
    <div class="title">Comment le traverser</div>
    <div id="reading"><div class="loading">Lecture en cours de génération…</div></div>
  </section>
</div>

<script src="fhd-bundle.js"></script>
<script>
/* ============ CONFIGURATION ============ */
// À remplacer une fois le Worker partagé déployé.
const WORKER_URL = "https://le-repere-partage.ludmillaenergie.workers.dev";

/* ============ NAVIGATION ENTRE ONGLETS ============ */
document.getElementById("tab-login").addEventListener("click", () => switchTab("login"));
document.getElementById("tab-signup").addEventListener("click", () => switchTab("signup"));
function switchTab(which) {
  document.getElementById("tab-login").classList.toggle("active", which === "login");
  document.getElementById("tab-signup").classList.toggle("active", which === "signup");
  document.getElementById("login-fields").classList.toggle("visible", which === "login");
  document.getElementById("signup-fields").classList.toggle("visible", which === "signup");
  document.getElementById("gate-status").textContent = "";
}

/* ============ RECHERCHE DE VILLE (réutilisée du prototype précédent) ============ */
let cityDebounceTimer = null;
function resolveTimezone(lat, lng) {
  try { return window.FreeHumanDesign.tzlookup(lat, lng); } catch (e) { return null; }
}
let selectedCity = null;
async function searchCity(query) {
  const box = document.getElementById("city-suggestions");
  if (!query || query.length < 3) { box.style.display = "none"; return; }
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=6&q=" + encodeURIComponent(query);
    const res = await fetch(url, { headers: { "Accept-Language": "fr" } });
    const results = await res.json();
    box.innerHTML = "";
    results.forEach(place => {
      const item = document.createElement("div");
      item.textContent = place.display_name;
      item.addEventListener("click", () => {
        document.getElementById("s-city").value = place.display_name;
        selectedCity = { lat: parseFloat(place.lat), lng: parseFloat(place.lon) };
        box.style.display = "none";
      });
      box.appendChild(item);
    });
    box.style.display = results.length ? "block" : "none";
  } catch (e) { console.error(e); }
}
document.getElementById("s-city").addEventListener("input", (e) => {
  clearTimeout(cityDebounceTimer);
  cityDebounceTimer = setTimeout(() => searchCity(e.target.value), 600);
});

/* ============ CHEMIN DE VIE ============ */
function reduceKeepMaster(n) {
  while (n > 9 && ![11, 22, 33].includes(n)) {
    n = String(n).split("").reduce((a, b) => a + parseInt(b, 10), 0);
  }
  return n;
}
function computeLifePath(birthdate) {
  const digits = birthdate.replace(/-/g, "").split("").map(Number);
  return reduceKeepMaster(digits.reduce((a, b) => a + b, 0));
}

/* ============ INSCRIPTION ============ */
document.getElementById("signup-btn").addEventListener("click", async () => {
  const statusEl = document.getElementById("gate-status");
  const btn = document.getElementById("signup-btn");
  statusEl.className = "status";
  statusEl.textContent = "";

  const name = document.getElementById("s-name").value.trim();
  const username = document.getElementById("s-username").value.trim();
  const password = document.getElementById("s-password").value;
  const birthdate = document.getElementById("s-date").value;
  const birthtime = document.getElementById("s-time").value;

  if (!name || !username || !password || !birthdate || !birthtime || !selectedCity) {
    statusEl.className = "status error";
    statusEl.textContent = "Merci de remplir tous les champs, y compris le choix d'une ville dans la liste.";
    return;
  }

  btn.disabled = true;
  statusEl.textContent = "Calcul du profil et création du compte…";

  try {
    const timezone = resolveTimezone(selectedCity.lat, selectedCity.lng);
    const chart = window.FreeHumanDesign.computeChart({
      birthdate, birthtime, timezone, location: selectedCity
    });
    const [line1, line2] = chart.humanDesign.profile.split("/").map(Number);
    const gk = chart.geneKeys.spheres;
    const profile = {
      name,
      type: chart.humanDesign.type,
      authority: chart.humanDesign.authority,
      profileLines: [line1, line2],
      lifePath: computeLifePath(birthdate),
      geneKeys: { lifeswork: gk.lifeswork, evolution: gk.evolution, radiance: gk.radiance, purpose: gk.purpose }
    };

    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "signup_intent", username, password, profile })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Erreur inconnue");

    statusEl.className = "status ok";
    statusEl.textContent = "Redirection vers le paiement…";
    window.location.href = data.checkoutUrl;
    return;
  } catch (e) {
    statusEl.className = "status error";
    statusEl.textContent = "Erreur : " + e.message;
  } finally {
    btn.disabled = false;
  }
});

/* ============ CONNEXION ============ */
document.getElementById("login-btn").addEventListener("click", async () => {
  const statusEl = document.getElementById("gate-status");
  const btn = document.getElementById("login-btn");
  const username = document.getElementById("l-username").value.trim();
  const password = document.getElementById("l-password").value;

  if (!username || !password) {
    statusEl.className = "status error";
    statusEl.textContent = "Identifiant et mot de passe requis.";
    return;
  }

  btn.disabled = true;
  statusEl.className = "status";
  statusEl.textContent = "Connexion…";

  try {
    // Les données astro du jour sont génériques, calculées ici comme avant (non montré : identique à computeToday() du prototype précédent).
    const payload = {
      action: "reading", username, password,
      date: new Date().toISOString(),
      numerology: { personalMonth: 5, monthTheme: "Introspection, retrait", personalDay: 3 },
      moonSign: "Poissons", moonPhase: "Pleine Lune", retrogradePlanets: [],
      aspects: []
    };
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Erreur inconnue");

    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("app-greeting").textContent = "Bonjour";
    document.getElementById("reading").innerHTML = data.text.split(/\n\n+/).map(p => `<p>${p}</p>`).join("");
  } catch (e) {
    statusEl.className = "status error";
    statusEl.textContent = "Erreur : " + e.message;
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
